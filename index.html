<style>
  :root { color-scheme: light dark; }

  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
         background:#f6f4f1; color:#22211f; }
  @media (prefers-color-scheme: dark) { body { background:#1b1a19; color:#e8e6e3; } }
  .gate { width:min(92vw,380px); padding:34px 28px; border-radius:16px;

  p.sub { font-size:13px; opacity:.62; margin:0 0 20px; line-height:1.5; }
  input { width:100%; padding:13px 14px; font-size:17px; text-align:center; letter-spacing:.28em;
          border:1.5px solid #ded9d2; border-radius:10px; background:transparent; color:inherit;
          outline:none; transition:border-color .15s; }
  input:focus { border-color:#7c6bd6; }
  button { width:100%; margin-top:12px; padding:13px; font-size:15px; font-weight:600;
           border:0; border-radius:10px; background:#7c6bd6; color:#fff; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:12px; font-size:13px; min-height:18px; opacity:.8; }
  .msg.err { color:#d2453c; opacity:1; }
  .brand { margin-top:18px; font-size:11px; opacity:.42; }
</style>

<script>
(function(){
  var ITER = 250000;
  var SALT = "nyx7HlpNP4CRxuK3TYoQ8w==";
  var payload = document.getElementById('payload').textContent.trim();
  var CACHE_KEY = 'hwb_key_v1';

  function b64buf(s){ var bin = atob(s); var u = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u.buffer; }

  async function derive(pw){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64buf(SALT), iterations: ITER, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  }

  function render(html){
    document.open(); document.write(html); document.close();
  }

  async function tryOpen(pw, fromCache){
    var bin = b64buf(payload);
    var iv = bin.slice(0, 16);
    var ct = bin.slice(16);
    var key = await derive(pw);
    try {
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, ct);
      var text = new TextDecoder().decode(plain);
      try { sessionStorage.setItem(CACHE_KEY, btoa(pw)); } catch(e){}
      render(text);
    } catch(e) {
      if (!fromCache) {
        var m = document.getElementById('msg');
        m.textContent = '비밀번호가 맞지 않습니다.';
        m.className = 'msg err';
        document.getElementById('go').disabled = false;
      }
    }
  }

  var cached = null;
  try { cached = sessionStorage.getItem(CACHE_KEY); } catch(e){}
  if (cached) {
    try { tryOpen(atob(cached), true); } catch(e){}
  } else {
    document.getElementById('go').addEventListener('click', function(){
      var v = document.getElementById('pw').value;
      if (!v) return;
      this.disabled = true;
      document.getElementById('msg').textContent = '확인 중…';
      document.getElementById('msg').className = 'msg';
      tryOpen(v, false);
    });
    document.getElementById('pw').addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('go').click();
    });
  }
})();
</script>
