  }

  function render(html){
    document.open(); document.write(html); document.close();
  }

  async function tryOpen(pw, fromCache){
    var bin = b64buf(payload);
    var iv = bin.slice(0, 16);
    var ct = bin.slice(16);
    var key = await derive(pw);
    try {
      var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv: iv}, key, ct);
      var text = new TextDecoder().decode(plain);
      try { sessionStorage.setItem(CACHE_KEY, btoa(pw)); } catch(e){}
      render(text);
    } catch(e) {
      if (!fromCache) {
        var m = document.getElementById('msg');
        m.textContent = '비밀번호가 맞지 않습니다.';
        m.className = 'msg err';
        document.getElementById('go').disabled = false;
      }
    }
  }

  var cached = null;
  try { cached = sessionStorage.getItem(CACHE_KEY); } catch(e){}
  if (cached) {
    try { tryOpen(atob(cached), true); } catch(e){}
  } else {
    document.getElementById('go').addEventListener('click', function(){
      var v = document.getElementById('pw').value;
      if (!v) return;
      this.disabled = true;
      document.getElementById('msg').textContent = '확인 중…';
      document.getElementById('msg').className = 'msg';
      tryOpen(v, false);
    });
    document.getElementById('pw').addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('go').click();
    });
  }
})();
</script>
</body>
</html>
